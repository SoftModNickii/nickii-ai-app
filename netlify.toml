# Netlify settings for the participant app (the site's "base directory" stays the repository root).
# For the console make a second Netlify site from the same repository and set its build command to
# `npm run build -w apps/console` and publish directory `apps/console/dist` (docs/setup.md step 7).
[build]
  command = "npm run build -w apps/participant"
  publish = "apps/participant/dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker must never be cached: a stale one would keep old push handling for weeks.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single-page app: every path serves index.html (notification links carry ?mode=line etc.).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
