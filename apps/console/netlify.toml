# Netlify settings for the console site. In Netlify set this site's base directory to `apps/console`;
# the build then runs from the repository root (see `command`).
[build]
  base = "apps/console"
  command = "cd ../.. && npm ci && npm run build -w apps/console"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
